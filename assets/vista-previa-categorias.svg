<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Variación por tipos distintos de victimización</title><desc id="desc">Recreación vectorial de la diapositiva 6: siete categorías del número de tipos distintos de victimización general, de 0 a 6, con prevalencia ponderada. Las asociaciones no prueban causalidad.</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F5F9FC"/><rect x="0" y="0" width="1280" height="10" rx="0" fill="#166DA5"/>
<text x="70" y="67" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#166DA5" text-anchor="start">OTRO MODO DE VERLO</text>
<text x="70" y="160" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#092C48" text-anchor="start">La ideación reportada varió según los tipos de victimización</text>
<text x="73" y="233" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#51728F" text-anchor="start">Se cuentan tipos diferentes reportados, no episodios ni frecuencia.</text>
<rect x="72" y="271" width="1135" height="350" rx="12" fill="#FFFFFF"/>
<text x="98" y="314" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#092C48" text-anchor="start">0 tipos</text><text x="212" y="314" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#51728F" text-anchor="start">n=392</text><rect x="335" y="298" width="686" height="22" rx="4" fill="#E9F3F7"/><rect x="335" y="298" width="60.368" height="22" rx="4" fill="#166DA5"/><text x="1158" y="314" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#166DA5" text-anchor="end">8.8%</text>
<text x="98" y="360" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#092C48" text-anchor="start">1 tipo</text><text x="212" y="360" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#51728F" text-anchor="start">n=193</text><rect x="335" y="344" width="686" height="22" rx="4" fill="#E9F3F7"/><rect x="335" y="344" width="198.94" height="22" rx="4" fill="#27A9BB"/><text x="1158" y="360" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087F93" text-anchor="end">29.0%</text>
<text x="98" y="406" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#092C48" text-anchor="start">2 tipos</text><text x="212" y="406" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#51728F" text-anchor="start">n=167</text><rect x="335" y="390" width="686" height="22" rx="4" fill="#E9F3F7"/><rect x="335" y="390" width="259.99399999999997" height="22" rx="4" fill="#27A9BB"/><text x="1158" y="406" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087F93" text-anchor="end">37.9%</text>
<text x="98" y="452" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#092C48" text-anchor="start">3 tipos</text><text x="212" y="452" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#51728F" text-anchor="start">n=125</text><rect x="335" y="436" width="686" height="22" rx="4" fill="#E9F3F7"/><rect x="335" y="436" width="284.69" height="22" rx="4" fill="#27A9BB"/><text x="1158" y="452" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087F93" text-anchor="end">41.5%</text>
<text x="98" y="498" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#092C48" text-anchor="start">4 tipos</text><text x="212" y="498" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#51728F" text-anchor="start">n=91</text><rect x="335" y="482" width="686" height="22" rx="4" fill="#E9F3F7"/><rect x="335" y="482" width="423.948" height="22" rx="4" fill="#27A9BB"/><text x="1158" y="498" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087F93" text-anchor="end">61.8%</text>
<text x="98" y="544" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#092C48" text-anchor="start">5 tipos</text><text x="212" y="544" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#51728F" text-anchor="start">n=72</text><rect x="335" y="528" width="686" height="22" rx="4" fill="#E9F3F7"/><rect x="335" y="528" width="431.494" height="22" rx="4" fill="#27A9BB"/><text x="1158" y="544" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087F93" text-anchor="end">62.9%</text>
<text x="98" y="590" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#092C48" text-anchor="start">6 tipos</text><text x="212" y="590" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#51728F" text-anchor="start">n=48</text><rect x="335" y="574" width="686" height="22" rx="4" fill="#E9F3F7"/><rect x="335" y="574" width="546.056" height="22" rx="4" fill="#27A9BB"/><text x="1158" y="590" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087F93" text-anchor="end">79.6%</text>
<text x="84" y="639" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#51728F" text-anchor="start">Diferencias descriptivas entre categorías; no se estimó el efecto de «sumar un tipo más».</text>
<text x="72" y="663" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#51728F" text-anchor="start">Análisis del proyecto: H2, ENDISEG 2021. Siete categorías; prueba global de heterogeneidad.</text>
<line x1="70" y1="674" x2="1210" y2="674" stroke="#CFE0EA" stroke-width="1"/><text x="70" y="694" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#51728F" text-anchor="start">Diversidad y salud mental en México  ·  ENDISEG 2021</text><text x="1200" y="694" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#51728F" text-anchor="end">06</text></svg>