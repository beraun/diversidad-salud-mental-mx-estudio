ill="#283449" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="600" text-anchor="start">Contraste global: heterogeneidad entre siete categorías (Wald F=29.5683).</text><text x="54" y="899" fill="#526173" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Cada punto es un grupo, sin línea de tendencia. Tipos ≠ frecuencia, gravedad o motivación LGBTfóbica.</text><text x="54" y="926" fill="#526173" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">Fuente: INEGI, ENDISEG 2021 · IC95% t marginales; muestra por grupo indicada en etiqueta.</text><text x="54" y="953" fill="#526173" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="start">No se conoce secuencia temporal ni se prueba tendencia lineal o causalidad. Figura interna.</text></svg>