<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">H2 · Ideación según tipos distintos de victimización</title>
<desc id="fig-desc">Siete grupos de jóvenes LGBT+ de 15 a 24 años. Cada punto muestra prevalencia ponderada de antecedentes de ideación alguna vez y el segmento horizontal su intervalo de confianza marginal de 95%. Los grupos con 0 a 6 tipos distintos tienen prevalencias de 8.77, 29.04, 37.85, 41.54, 61.83, 62.94 y 79.60 por ciento, respectivamente. No demuestra causalidad ni tendencia lineal.</desc>
