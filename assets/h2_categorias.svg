<text x="60" y="959" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#546577" font-weight="400" text-anchor="start">Tipos distintos ≠ episodios, frecuencia, gravedad ni necesariamente motivación LGBTfóbica.</text>
